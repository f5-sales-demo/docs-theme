name: Dispatch Downstream Rebuild

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: dispatch-downstream
  cancel-in-progress: true

jobs:
  dispatch:
    name: Notify f5xc-docs-builder
    runs-on: docs-socketless
    environment: release
    steps:
      - name: Verify npm package version exists
        env:
          # A release tag name is caller-supplied text, so interpolating it into the
          # run body would let it expand into executable shell. Through env it is
          # inert data that bash only ever reads as a variable.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "Checking npm for @f5-sales-demo/docs-theme@${VERSION}..."
          for i in 1 2 3 4 5; do
            if npm view "@f5-sales-demo/docs-theme@${VERSION}" version 2>/dev/null; then
              echo "Version ${VERSION} confirmed on npm"
              exit 0
            fi
            echo "Attempt ${i}: not found yet, waiting 15s for npm propagation..."
            sleep 15
          done
          echo "::error::Version ${VERSION} not found on npm after 5 attempts"
          exit 1

      - name: Dispatch supported docs-builder image build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh workflow run build-image.yml \
            --repo f5-sales-demo/docs-builder \
            --ref main \
            -f dispatch_downstream=true
