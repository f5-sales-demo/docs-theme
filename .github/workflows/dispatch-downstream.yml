name: Dispatch Downstream Rebuild

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispatch-downstream
  cancel-in-progress: true

jobs:
  dispatch:
    name: Refresh docs-builder latest theme source
    if: github.event_name == 'release' || (github.ref == 'refs/heads/main' && github.ref_protected)
    runs-on: docs-socketless
    environment: release
    steps:
      - name: Verify independently resolved latest npm publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            latest_tag=$(gh api repos/f5-sales-demo/docs-theme/releases/latest --jq '.tag_name')
            if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::Latest theme publication has an invalid identity'
              exit 1
            fi
            npm_version=$(npm view '@f5-sales-demo/docs-theme@latest' version 2>/dev/null || true)
            if [[ "v${npm_version}" == "$latest_tag" ]]; then
              echo "Latest theme ${latest_tag} confirmed on npm"
              exit 0
            fi
            echo "Attempt ${attempt}: latest npm/GitHub publications have not converged"
            sleep 15
          done
          echo '::error::Latest theme publication is not readable on npm'
          exit 1

      - name: Dispatch supported docs-builder source refresh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh workflow run refresh-latest-theme.yml \
            --repo f5-sales-demo/docs-builder \
            --ref main
